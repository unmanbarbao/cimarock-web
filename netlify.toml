# CimaRock — deploy manual (sin build en Netlify)
#
# El sitio se construye en local y se sube con Netlify CLI.
# `ignore = "exit 0"` cancela cualquier build automático para no gastar minutos.
#
#   npm --prefix frontend run deploy

[build]
  ignore = "exit 0"
  publish = "frontend/dist"

# SPA React Router (labs cubiertos en frontend/public/_redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
